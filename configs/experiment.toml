# Benchmark settings. Tuned once on the dev set, then frozen.
# The model comes from MODEL_NAME in .env, the computer name from MACHINE_ID.

# Seed of a run = seed + 1000 * rep + position of the item in its split. All approaches share
# it for the same (item, rep), and the k-th LLM call inside a run uses seed + k.
seed = 2026
reps = 3

# Same settings for every approach (one variable only: the control flow).
[llm]
temperature = 0.7
num_ctx = 4096
num_predict = 1024

# Per-approach settings, filled in as the approaches are built.
[approaches.baseline]

# Reflective: at most `max_attempts` answers in total (first answer plus fixes). Each fix is
# one critic call and one reviser call; stops early when the feedback check passes.
[approaches.reflective]
max_attempts = 3

# Multi-agent: each round is planner, solver, feedback check, and (if the check failed) critic,
# whose notes go to the planner of the next round. Stops early when the check passes.
[approaches.multi_agent]
max_rounds = 2

# Tree of Thoughts, Game of 24 (as in the paper's code): each kept node proposes steps; every
# readable line becomes a child (breadth 0; a number N keeps only the first N lines); each
# child gets `value_samples` judgements in one call (weights sure 20, likely 1, impossible
# 0.001, summed); the best `keep` of the level survive. game24_writer "reached_24" writes an
# answer only from a kept leaf whose numbers left are 24. The first test run used breadth 3,
# keep 3, one judgement and a writer on the best path (see README, Limitations).
# HumanEval: `humaneval_breadth` plans (one call each), each scored once; the best
# `humaneval_keep` become code in score order until one passes the own tests.
[approaches.tot]
breadth = 0
keep = 5
value_samples = 3
humaneval_breadth = 3
humaneval_keep = 2
game24_writer = "reached_24"

# Self-consistency (separate study, Game of 24 only, never in the main results): `samples`
# independent baseline calls (29 = the call budget of our first, lighter ToT), answer by
# majority vote, no verifier.
[approaches.self_consistency]
samples = 29
